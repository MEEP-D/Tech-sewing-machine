name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Run deploy script on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT }}
        run: |
          DEPLOY_HOST_CLEAN="$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n')"
          DEPLOY_USER_CLEAN="$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n')"
          DEPLOY_PORT_CLEAN="$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '\r\n')"
          DEPLOY_SCRIPT_CLEAN="$(printf '%s' "${DEPLOY_SCRIPT:-/home/bncvyqjyhosting/deploy.sh}" | tr -d '\r\n')"

          test -n "$DEPLOY_HOST_CLEAN"
          test -n "$DEPLOY_USER_CLEAN"
          test -n "$DEPLOY_PORT_CLEAN"

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -p "$DEPLOY_PORT_CLEAN" \
            "$DEPLOY_USER_CLEAN@$DEPLOY_HOST_CLEAN" \
            "bash $DEPLOY_SCRIPT_CLEAN"
